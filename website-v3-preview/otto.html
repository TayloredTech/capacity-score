<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otto — the living orb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;600&family=Josefin+Sans:wght@400;600&display=swap');
  :root{--bg0:#0b1a2c;--bg1:#10243a;--line:rgba(217,189,146,.18);--gold:#b8924a;--gold-b:#d9bd92;--hd:#f3f1ea;--tx:#c3ced6;--tx-dim:#9fb1bc}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 50% -5%,#143049,rgba(20,48,73,0) 60%),linear-gradient(180deg,#0b1a2c,#0a1524);color:var(--hd);font-family:'Manrope',system-ui,sans-serif}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:3rem 1.2rem}
  .card{width:min(30rem,94vw);text-align:center}
  .kick{font-family:'Josefin Sans',sans-serif;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-b);opacity:.85}
  .orbwrap{margin:1.6rem auto .4rem;width:min(20rem,74vw);aspect-ratio:1}
  .orb{width:100%;height:100%;display:block}
  .petal{mix-blend-mode:screen;transform-box:fill-box;transform-origin:center}
  .state{font-family:'Spectral',serif;font-size:2.5rem;line-height:1;margin:.6rem 0 .5rem;color:var(--gold-b)}
  .dir{font-size:1.02rem;line-height:1.6;color:var(--tx);max-width:26rem;margin:0 auto}
  .foot{margin-top:2.4rem;font-family:'Josefin Sans',sans-serif;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-dim)}
  .g{width:100%;height:100%;transform-origin:150px 150px;animation:spin 46s linear infinite}
  .core{animation:breathe 6.5s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.96}50%{transform:scale(1.05);opacity:1}}
  @media(prefers-reduced-motion:reduce){.g,.core{animation:none}}
</style></head>
<body><div class="wrap"><div class="card">
  <p class="kick">Otto &middot; Today's directive</p>
  <div class="orbwrap">
    <svg class="orb" viewBox="0 0 300 300" aria-label="Otto, the living orb, in the Steady state">
      <defs><radialGradient id="core" cx="50%" cy="45%" r="60%">
        <stop offset="0%" stop-color="#cdeafd"/><stop offset="45%" stop-color="#6cc8ef"/><stop offset="100%" stop-color="#2f9fd6"/>
      </radialGradient></defs>
      <g class="g" id="petals"></g>
      <g class="core" style="transform-origin:150px 150px">
        <circle cx="150" cy="150" r="52" fill="#fff"/>
        <circle cx="150" cy="150" r="34" fill="url(#core)"/>
      </g>
    </svg>
  </div>
  <div class="state">Steady</div>
  <p class="dir">The wheel's turning clean. Hold the cadence, and bank the gains. One clear read, every morning.</p>
  <p class="foot">The living orb &middot; Otto's brandmark, alive</p>
</div></div>
<script>
  var g=document.getElementById('petals'),N=7,R=70,off=50,cx=150,cy=150,
      tints=['#29ABE2','#4fb6e8','#29ABE2','#4fb6e8','#29ABE2','#4fb6e8','#3fb0e5'];
  for(var i=0;i<N;i++){var a=(i/N)*Math.PI*2-Math.PI/2,px=cx+Math.cos(a)*off,py=cy+Math.sin(a)*off,
      c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',px.toFixed(1));c.setAttribute('cy',py.toFixed(1));c.setAttribute('r',R);
    c.setAttribute('fill',tints[i]);c.setAttribute('fill-opacity','0.62');c.setAttribute('class','petal');
    g.appendChild(c);}
</script>
</body></html>
