<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ExecOS Performance Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b1a2c;--panel:#10243a;--panel2:#143049;--line:#24415d;--fg:#e9eef4;--mute:#9fb2c6;--gold:#cdaa6b;--gold-d:#b8924a;--red:#e07070;--ok:#7fc79a;
  --display:"Playfair Display",Georgia,serif;--body:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding:20px 16px 64px;overflow-wrap:anywhere}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-family:var(--display);font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h1:focus,h2:focus{outline:none}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
p{margin:0}.mute{color:var(--mute)}.small{font-size:14px}
a{color:var(--gold)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;max-width:100%}
button.on,button.primary{background:var(--gold-d);border-color:var(--gold);color:#0b1a2c;font-weight:700}
button[disabled]{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card,.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q.miss{border-color:var(--gold)}
.qlabel{font-weight:600;font-size:17px}
.qlabel b{font-weight:700;color:var(--gold)}
.opt-tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.opts button{text-align:left;padding:9px 12px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.opts.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.opts.scale button{text-align:center;padding:10px 0}
.anchors{display:flex;gap:12px;justify-content:space-between;font-size:14px}
.anchor{flex:1 1 0;min-width:0}.anchor.hi{text-align:right}
.anchor b{color:var(--gold);margin-right:2px}
.fu{border-left:3px solid var(--gold-d);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.sug{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:10px}
.sug textarea{min-height:64px;font-size:15px}
button.link{background:none;border:0;padding:2px 0;color:var(--gold);font-size:14px;text-decoration:underline;text-underline-offset:3px;border-radius:4px}
.prog{display:flex;flex-direction:column;gap:6px}
.progtop{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;align-items:baseline}
.savenote{font-size:12px;color:var(--mute)}.savenote.bad{color:var(--gold);font-weight:600}
.track{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.fill{height:100%;background:var(--gold);border-radius:99px;transition:width .25s ease}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{flex:1 1 140px;padding:13px 16px}
.warn{border:1px solid var(--gold);background:var(--panel2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.warn .nav button{padding:10px 14px}
[hidden]{display:none!important}
.err{color:var(--red);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--gold-d)}
#copybox{min-height:160px;font-size:13px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-weight:600;animation:stepin .3s ease}
.mark{flex:0 0 22px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;margin-top:1px}
.mark.busy{border:2px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite}
.mark.done{background:var(--ok);color:#0b1a2c}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stepin{from{opacity:0;transform:translateY(4px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
a.cta{display:block;text-align:center;text-decoration:none;font-weight:700;color:#0b1a2c;background:var(--gold-d);border:1px solid var(--gold);border-radius:10px;padding:13px 16px}
a.cta:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:420px){.opts.scale{gap:4px}.q,.card{padding:14px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.steps li,.mark.busy{animation:none}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<noscript><p>This form needs JavaScript turned on.</p></noscript>

{"all":[{"any":[{"q":"q40","op":"eq","val":"yes"},{"q":"q40","op":"eq","val":"transition"}]},{"q":"q71","op":"neq","val":"0"}]}}]},{"id":"B","title":"Why you are here","intro":null,"opening":"What brought you here and what you have already tried, so we start from where you are.","questions":[{"id":"q6","label":"What are some of the gaps between where your body performs now and where you need it to be?","help":"Select all that apply.","type":"multiselect","options":[{"value":"energy","label":"Energy levels"},{"value":"sleep","label":"Sleep quality"},{"value":"stress","label":"Stress management"},{"value":"nutrition","label":"Nutrition"},{"value":"movement","label":"Movement and training"},{"value":"cognitive","label":"Cognitive performance and mental clarity"},{"value":"body_comp","label":"Body composition"},{"value":"hormones","label":"Hormone health"},{"value":"pain","label":"Resolving pain or injury"},{"value":"work_life","label":"Work-life balance"},{"value":"mindset","label":"Mindset and mental resilience"},{"value":"longevity","label":"Longevity"},{"value":"athletic","label":"Athletic performance"},{"value":"health_foundation","label":"Overall health foundation"},{"value":"other","label":"Other","specify":true}],"followUp":{"whenAny":["other"],"label":"What is it?","optional":true}},{"id":"q7","label":"If you could only close **one** gap, which one would make the biggest difference?","type":"select","options":[{"value":"energy","label":"Energy levels"},{"value":"sleep","label":"Sleep quality"},{"value":"stress","label":"Stress management"},{"value":"nutrition","label":"Nutrition"},{"value":"movement","label":"Movement and training"},{"value":"cognitive","label":"Cognitive performance and mental clarity"},{"value":"body_comp","label":"Body composition"},{"value":"hormones","label":"Hormone health"},{"value":"pain","label":"Resolving pain or injury"},{"value":"work_life","label":"Work-life balance"},{"value":"mindset","label":"Mindset and mental resilience"},{"value":"longevity","label":"Longevity"},{"value":"athletic","label":"Athletic performance"},{"value":"health_foundation","label":"Overall health foundation"},{"value":"other","label":"Other","specify":true}],"followUp":{"whenAny":["other"],"label":"What is it?","optional":true}},{"id":"NEW-3","label":"What have you already tried for that?","type":"multiselect","options":[{"value":"gp","label":"Seen my GP"},{"value":"testing","label":"Had testing done (bloods or other)"},{"value":"specialist","label":"Seen a specialist"},{"value":"functional","label":"A naturopath, functional or integrative practitioner"},{"value":"trainer","label":"A personal trainer or coach"},{"value":"nutritionist","label":"A nutritionist or dietitian"},{"value":"supplements","label":"Supplements I chose myself"},{"value":"wearable_app","label":"A wearable or an app"},{"value":"changed_training","label":"Changed my training"},{"value":"changed_eating","label":"Changed how I eat"},{"value":"therapy","label":"Therapy, coaching or mindfulness"},{"value":"nothing","label":"Nothing yet","exclusive":true},{"value":"other","label":"Other"}],"followUp":{"whenAny":["gp","testing","specialist","functional","trainer","nutritionist","supplements","wearable_app","changed_training","changed_eating","therapy","other"],"label":"Anything you want to add about what you tried, and how it went?","optional":true}},{"id":"q9","label":"What is driving you to be here?","help":"Pick up to two, or all of these.","type":"multiselect","options":[{"value":"performance","label":"**Performance:** I want to operate at my peak right now"},{"value":"longevity","label":"**Longevity:** I want to build a body and mind that lasts decades"},{"value":"health_concern","label":"**A specific health concern**"},{"value":"all","label":"**All of these**","exclusive":true}]},{"id":"q10","label":"What is the health concern?","type":"longtext","showWhen":{"any":[{"q":"q9","op":"includes","val":"health_concern"},{"q":"q9","op":"includes","val":"all"}]}},{"id":"q8","label":"If you stay on your current trajectory for the next 10 years, where does that land you?","help":"Be honest. This is not a trick question and there is no right answer. It is the most useful input you can give us.","type":"longtext"}]},{"id":"C","title":"Goals","intro":"In your own words. These are quoted back to you.","opening":"What you want out of this, so we are both aiming at the same thing.","questions":[{"id":"q11","label":"Short-term goal, achievable within the next 3 months.","help":"Be specific. Include a metric. For example: Sleep 7.5 or more hours consistently by August. Or complete four structured training sessions per week.","type":"longtext"},{"id":"q12","label":"Mid and long-term goal, 6 months or more out.","help":"Six months to a few years out. Be specific and include a metric where you can. For example: finish a half marathon next winter, or hold your weight within two kilos for a full year.","type":"longtext","optional":true},{"id":"q13","label":"Your ultimate goal, with every limitation removed.","help":"Think ten years or more out. If nothing stood in your way, not time, money or your body, what would you love to do or become? Dream, then write it down.","type":"longtext"}]},{"id":"D","title":"Where you are right now","intro":"Rate each area on your average over the last month. 1 is as bad as it gets. 10 is optimal.","opening":"A quick score for each main area, so we can see your starting point in your own numbers.","questions":[{"id":"q16","label":"Energy levels","help":"Does your energy limit your output, or are you consistently fuelled throughout the day?","type":"rating","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"},{"value":"6","label":"6"},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label":"9"},{"value":"10","label":"10"}],"anchorLow":"Consistently depleted","anchorHigh":"Consistently energised with no dips"},{"id":"q17","label":"Mental clarity and focus","help":"Rate your average ability to think clearly, make quality decisions, and sustain concentration on demand.","type":"rating","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"},{"value":"6","label":"6"},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label":"9"},{"value":"10","label":"10"}],"anchorLow":"Foggy, reactive, and scattered","anchorHigh":"Sharp, proactive, and producing high-quality output"},{"id":"q18","label":"Mental resilience under pressure","help":"When load spikes and things go sideways, how well do you hold up?","type":"rating","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"},{"value":"6","label":"6"},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label":"9"},{"value":"10","label":"10"}],"anchorLow":"I default to problems, blame, and resistance","anchorHigh":"I default to solutions, ownership, and forward movement"},{"id":"q19","label":"Nutrition","help":"How intentional and consistent is your approach to fuelling yourself?","type":"rating","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"},{"value":"6","label":"6"},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label":"9"},{"value":"10","label":"10"}],"anchorLow":"Reactive and convenience-driven","anchorHigh":"Deliberate, structured, and performance-focused"},{"id":"q20","label":"Movement","help":"Are you sedentary, or actively structured in your physical output?","type":"rating","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"},{"value":"6","label":"6"},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label": "},{"value":"7","label":"7"},{"value":"8","label":"8"},{"value":"9","label":"9"},{"value":"10","label":"10"}],"anchorLow":"As bad as it could be","anchorHigh":"Optimal. Couldn't be better"},{"id":"q14","label":"Has your weight or body composition changed meaningfully in the last 12 months?","type":"select","options":[{"value":"gained","label":"Gained weight or body fat"},{"value":"lost","label":"Lost weight or body fat"},{"value":"recomposed","label":"Changed composition without much scale change"},{"value":"stable","label":"Stayed stable"},{"value":"not_tracking","label":"I have not been tracking it"}],"followUp":{"whenAny":["gained","lost","recomposed"],"label":"Anything you want to add about the change?","optional":true}},{"id":"q15","label":"Have you noticed any change in your memory, word recall, or mental sharpness in the last 12 months?","type":"select","options":[{"value":"sharper","label":"Noticeably sharper than before"},{"value":"no_change","label":"No change"},{"value":"minor_decline","label":"Minor decline I have noticed"},{"value":"meaningful_decline","label":"Meaningful decline I am concerned about"},{"value":"prefer_not","label":"Prefer not to say"}],"followUp":{"whenAny":["sharper","minor_decline","meaningful_decline"],"label":"Anything you want to add about the change?","optional":true}}]},{"id":"E","title":"Sleep","intro":"Answer for a typical month, in the order of a night.","opening":"How your nights usually go, from going to bed to getting up. We ask in some detail because no two people sleep the same way.","questions":[{"id":"q37a","label":"On a typical work night, what time do you go to bed?","type":"select","options":[{"value":"before_9","label":"Before 9 pm"},{"value":"9_10","label":"9 to 10 pm"},{"value":"10_11","label":"10 to 11 pm"},{"value":"11_12","label":"11 pm to midnight"},{"value":"after_12","label":"After midnight"},{"value":"no_pattern","label":"No consistent pattern"}]},{"id":"q51","label":"I have difficulty falling asleep.","ty const CFG = {
  endpoint: 'https://gdsdtawkigzpyseavkqp.supabase.co/rest/v1/performance_screen_reviews',
  apiKey: 'sb_publishable_9xYl5CzjcQ6cBCEmCfPs5Q_NwI7z_JQ',

};

const BOOK_URL = 'https://calendar.app.google/SBPrfDtq16pZh1zP8';

const fresh = () => ({unlocked: CLIENT, step: CLIENT ? 'intro' : 'gate', sec: null, who: {name: '', consent: false}, answers: {}, notes: {}, wrap: {}, startedAt: null, active: 0});

try { const v = localStorage.getItem(CFG.storeKey); if (v) S = Object.assign(fresh(), JSON.parse(v)); } catch {}
// saveOk: true only when the browser really holds what we just wrote. false when storage is blocked or full. null before the first write.

let resume = S.unlocked === true && (S.step === 'q' || S.step === 'wrap');
const answers = S.answers;
const openNotes = new Set();
let warn = false, lastAct = Date.now(), failText = '', sending = false;

// Same rule shape and operators as the app's questionnaire-visibility.ts.
function ev(c){
  if (!c) return true;
  if (c.all) return c.all.every(ev);
  if (c.any) return c.any.some(ev);
  const a = answers[c.q];
  switch (c.op) {
    case 'eq': return a === c.val;
    case 'neq': return a !== c.val && a !== '' && a !== undefined;
    case 'includes': return Array.isArray(a) && a.includes(c.val);
    case 'lt': return a != null && a !== '' && Number(a) < Number(c.val);

function rich(node, text){

      if (ctl.signal.aborted) return false;   // no answer in time. Not sent again, in case the first one still lands.

  const again = btn('Try sending again', '', () => { S.step = 'wrap'; go(); });
  const n = el('div', 'nav'); n.append(again, cp);
  c.append(t, n, st);
  return [head('That did not go through'), c];
}

// k: refocus the control that was just used, since a re-render replaces it.
function render(k, focusNote){
  const v = !S.unlocked && S.step !== 'done' ? viewGate() : resume ? viewResume() : S.step === 'intro' ? viewIntro() : S.step === 'q' ? viewSection() : S.step === 'wrap' ? viewWrap() : S.step === 'saving' ? viewSaving() : S.step === 'done' ? viewDone() : S.step === 'fail' ? viewFail() : CLIENT ? viewIntro() : viewGate();
  app.replaceChildren(...v);
  if (k) {
    const sel = focusNote ? k.replace('|sug', '|note') : k;
    const t = [...app.querySelectorAll('[data-k]')].find(n => n.dataset.k === sel);
    if (t) t.focus({preventScroll: true});
  }
}
// A change of screen: draw it, go to the top, and put focus on its heading.
function go(){ render(); window.scrollTo(0, 0); const h = app.querySelector('h1'); if (h && S.step !== 'gate' && S.unlocked) h.focus({preventScroll: true}); }

// Seconds actively spent on the questions: the tab is in view and something was touched in the last minute.
for (const t of ['pointerdown', 'keydown', 'scroll']) addEventListener(t, () => { lastAct = Date.now(); }, {passive: true});
setInterval(() => {
  if (!resume && (S.step === 'q' || S.step === 'wrap') && document.visibilityState === 'visible' && Date.now() - lastAct < 60000) {
    S.active = (S.active || 0) + 1;
    // The same second, credited to the section on screen, so we can see WHERE the time goes.
    const k = S.step === 'wrap' ? 'wrap' : S.sec;
    if (k) { S.secSeconds = S.secSeconds || {}; S.secSeconds[k] = (S.secSeconds[k] || 0) + 1; }
    if (S.active % 5 === 0) save();
  }
}, 1000);

if (S.step === 'done' || S.step === 'fail' || S.step === 'saving') S.step = 'wrap';
render();
})();
</script>
