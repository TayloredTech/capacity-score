*{box-sizing:border-box;margin:0;padding:0}

#intro .wrap{padding-top:clamp(3rem,10vh,6rem)}

   stays ONE column so the rhythm never goes ragged the way the end screen did */
@media (min-width:760px){
  #intro .wrap{max-width:46rem}
}
#intro h1{font-size:clamp(2.1rem,7vw,3.3rem);margin:.9rem 0 1.4rem}
#intro .lede{font-size:1.08rem;color:var(--cream-soft);max-width:33rem}
.carry{margin:0 0 1.8rem}
.carry p{font-size:.95rem;color:var(--cream-soft);margin:0 0 .7rem}
.carry .opts{display:flex;flex-wrap:wrap;gap:.5rem}
.carry button{font:inherit;font-size:.88rem;color:var(--cream-soft);background:transparent;
  border:1px solid var(--rule-l);border-radius:2rem;padding:.45rem 1rem;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.carry button:hover{border-color:var(--cream-soft)}
.carry button[aria-pressed="true"]{border-color:var(--gold,#b8924a);color:var(--cream,#f4efe6);
  background:rgba(184,146,74,.12)}
#intro .how{margin:1.6rem 0 1rem;padding:1.2rem 0;border-top:1px solid var(--rule-l);border-bottom:1px solid var(--rule-l);font-size:.95rem;color:var(--cream-soft)}
#intro .how p+p{margin-top:.35rem}
.snapshot{margin:0 0 2rem;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:1.1rem;color:var(--gold)}
/* the opening diagram. One wheel with a key underneath in the wheel's own
   clockwise order, never four boxes: part of what it teaches is that the four
   move each other. */
/* ⛔ ONE WHEEL, NOT FOUR BOXES. Rachel: "part of what you are teaching is that
   they affect one another." The wheel is the hero and carries the four NAMES on
   it, in their real positions, with the gold arrows between them. The blurbs sit
   under it in the wheel's own clockwise order, as a key to one diagram rather
   than four cards. No borders, no boxes. */
.model{margin:2.4rem 0 .5rem}
.modelring{max-width:33rem;margin:0 auto}
.modelring svg{display:block;width:100%;height:auto}
.modelkey{margin:1.8rem 0 0;display:grid;gap:.1rem}
.node{display:grid;gap:.1rem;padding:.7rem 0;border-top:1px solid var(--rule-l)}
.modelkey .node:first-child{border-top:0}
.nodename{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:.45rem}
.nodedot{width:8px;height:8px;border-radius:50%;flex:none}
.nodeblurb{font-size:.95rem;color:var(--cream);line-height:1.45}
.nodecue{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--cream-faint);white-space:nowrap}
.nodecue.lever{color:var(--gold)}
.modelcaption{margin:1.2rem 0 0;padding-top:1rem;border-top:1px solid var(--rule-l);font-size:.85rem;color:var(--cream-faint)}
@media (min-width:760px){
  .modelring{max-width:37rem}
  /* two comfortable columns so no blurb sits on a cramped measure. Reading
     order stays clockwise: Biology, Leadership, then Behaviour, Environment. */
  .modelkey{grid-template-columns:1fr 1fr;column-gap:2.2rem;row-gap:0}
  .modelkey .node:nth-child(2){border-top:0}
}
/* 320 is the floor we support. Two display lines fell over there: the kicker's
   tracking and the longest role option. Both fit once the tracking and the type
   come down, and the options go full width. */
@media (max-width:400px){
  .kicker{font-size:.64rem;letter-spacing:.14em}
  .carry .opts{flex-direction:column}
  .carry button{width:100%;text-align:left;font-size:.76rem;padding-left:.7rem;padding-right:.7rem;white-space:nowrap}
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brandline{margin-top:3.5rem;font-size:.8rem;color:var(--cream-faint)}
/* diagnostic */
.progress{height:3px;background:var(--rule-l)}
.progress i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .35s ease}
.partmeta{font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-faint);margin-bottom:.7rem}
.part h2{font-size:clamp(1.6rem,5vw,2.2rem)}
.part .lead{color:var(--cream-soft);margin:.7rem 0 .4rem;max-width:34rem}
.timeframe{font-size:.8rem;font-style:italic;color:var(--cream-faint);margin-bottom:.4rem}
/* slider statement */
.sl{padding:2.6rem 0 2rem;border-top:1px solid var(--rule-l)}
.sl:first-child{padding-top:2rem}
.sl-poles{display:flex;justify-content:space-between;gap:1.2rem;margin-bottom:.9rem}
.pole{flex:1;font-family:'Poppins',Manrope,sans-serif;font-size:.96rem;line-height:1.5;color:var(--cream);opacity:.92;transition:opacity .2s,color .2s}
.pole.left{text-align:left}
.pole.right{text-align:right}
.pole small{display:block;font-family:'Poppins',sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:.55rem;opacity:.9}
.pole.left small{color:var(--drag-l)}
.pole.right small{color:var(--gold)}
.pole.dim{opacity:.4}
.track{position:relative;height:36px;cursor:grab;touch-action:none;outline:none}
.track:active{cursor:grabbing}
.rail{position:absolute;top:50%;left:5px;right:5px;height:4px;transform:translateY(-50%);background:var(--rule-l);border-radius:3px}
.fill{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:3px;background:var(--drag-l)}
.center{position:absolute;top:50%;left:50%;width:1px;height:16px;transform:translate(-50%,-50%);background:rgba(243,239,231,.4)}
.knob{position:absolute;top:50%;left:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);background:var(--navy);border:2px solid var(--drag-l);display:grid;place-items:center;transition:border-color .18s,background .18s;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.knob::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--drag-l);transition:background .18s}
.knob.lift{border-color:var(--gold);background:var(--gold)}
.knob.lift::after{background:var(--navy-deep)}
/* ⛔ 28 Sept 2026. The marker was painted on Neutral at load, so a person who
   genuinely sits in the middle saw a marker that looked set, pressed Next, and
   was blocked. The only escape was moving off centre. Untouched now draws as a
   hollow ring so the centre is visibly unselected, and a tap fills it. ⛔ Do NOT
   "fix" this by counting an untouched centre as Neutral: skipping a page would
   then score 50 and be read as Steady. */
.knob.untouched{background:transparent;border-color:rgba(243,239,231,.5);border-style:dashed;box-shadow:none}
.knob.untouched::after{background:transparent}
.track:focus-visible .knob{box-shadow:0 0 0 3px rgba(184,146,74,.5)}
.scale{display:flex;justify-content:space-between;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cream-faint);margin-top:.55rem}
.scale span:nth-child(2){opacity:.7}
.partnav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--rule-l);gap:1rem}
.hint{font-size:.82rem;color:var(--gold);opacity:0;transition:opacity .25s}
.hint.show{opacity:1}
.navbtns{display:flex;gap:.6rem;align-items:center}
.backbtn{font:inherit;font-weight:600;font-size:.9rem;color:var(--cream-soft);background:none;border:1px solid var(--rule-l);border-radius:3px;padding:.9rem 1.3rem;cursor:pointer;transition:border-color .2s,color .2s}
.backbtn:hover{border-color:var(--cream-faint);color:var(--cream)}
.backbtn:disabled{opacity:.25;cursor:not-allowed}
/* email */
#email .wrap{padding-top:clamp(3rem,12vh,7rem);max-width:27rem}
#email h2{font-size:clamp(1.7rem,5vw,2.3rem);margin-bottom:.8rem}
#email p{color:var(--cream-soft)}
#email label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cream-soft);margin:1.3rem 0 .3rem}
#email input{width:100%;font:inherit;font-size:1rem;padding:.8rem .95rem;border:1.5px solid var(--rule-l);border-radius:3px;background:var(--field);color:var(--cream)}
#email input::placeholder{color:var(--cream-faint)}
#email input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
#email .btn{margin-top:1.6rem;width:100%}
.privacy{font-size:.76rem;color:var(--cream-faint);margin-top:.9rem}
/* result (dark reveal — kept as-is) */
#result{background:var(--navy-mid);color:var(--cream)}
#result h2,#result h3{color:var(--cream)}
#result .wrap{max-width:42rem}
.bandchip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--navy-deep);background:var(--gold);border-radius:2px;padding:.3rem .7rem;margin:.8rem 0 0}
.bandlabel{text-align:center;color:var(--cream);font-size:1.05rem;font-weight:600;margin:.55rem auto 0;max-width:30rem;line-height:1.4}
#result .headrow{text-align:center}
#result .headrow h2{font-size:clamp(1.8rem,5vw,2.4rem)}
.wheelbox{position:relative;max-width:430px;margin:1.2rem auto .4rem}
.wheelbox svg{display:block;width:100%;height:auto}
/* ⛔ 28 Sept 2026: these three were centred, which left them floating as
   orphaned ragged blocks between a centred wheel and left-aligned cards. One
   column means one left edge for everything that is prose. */
.scoremeans{font-size:.82rem;line-height:1.5;color:var(--cream-faint);text-align:left;margin:.1rem 0 .9rem;}
.bandread{max-width:none;margin:0;text-align:left;color:var(--cream-soft);font-size:1.02rem}
.leak{max-width:none;margin:.9rem 0 0;text-align:left;font-size:.85rem;color:var(--gold);letter-spacing:.04em}
.leak .leaklead{display:block}
.leak .leakdesc{display:block;margin-top:.15rem;font-size:.78rem;letter-spacing:.02em;color:var(--cream-faint)}
/* every card fills the one column, so the rhythm never goes ragged */
.resultcard{max-width:none;margin:2.4rem auto 0;padding:1.6rem 1.5rem;background:rgba(243,239,231,.05);border:1px solid var(--rule-l);border-radius:4px}
.resultcard h3{font-size:1.3rem;margin-bottom:.7rem}
.cardsub{color:var(--cream-soft);font-size:.95rem;margin:-.35rem 0 1.1rem}
.evenline{margin-top:1.2rem;padding-top:1.1rem;border-top:1px solid var(--rule-l);color:var(--cream);font-weight:600;font-size:.95rem}
.cohtab{margin-top:1.2rem;padding-top:1.1rem;border-top:1px solid var(--rule-l)}
.cohtab summary{cursor:pointer;list-style:none;font-weight:700;font-size:.95rem;color:var(--gold);display:flex;align-items:center;gap:.5rem}
.cohtab summary::-webkit-details-marker{display:none}
.cohtab summary::before{content:'+';font-size:1.1rem;line-height:1;width:1rem;flex:none}
.cohtab[open] summary::before{content:'\2212'}
.cohtab summary:hover{color:var(--cream)}
.cohtab .cohbody{margin-top:.8rem}
/* Steady's label is the longest thing on the screen ("Come back next month and
   see if it moved"). The button goes full width of the card and the type scales
   down on a narrow phone so the label stays on ONE line at 375px. */
.ctablock{margin-top:1.4rem}
.ctablock .ctabtn{display:block;width:100%;margin-top:0;padding:.95rem .6rem;font-size:.95rem;white-space:nowrap;border:none;font-family:inherit;cursor:pointer}
.ctablock .ctabtn.longlabel{font-size:clamp(.74rem,3.1vw,.95rem)}
/* ⛔ a class selector setting display:block beats the browser's own
   [hidden]{display:none}, so without this the hidden button still renders and
   Steady showed BOTH calls to action stacked inside one gold block. */
.ctablock .ctabtn[hidden]{display:none}
.copynote{font-size:.85rem;color:var(--gold);margin:.7rem 0 0;min-height:1.2em}
.quietline{margin:.55rem 0 0}
.quietline a{color:var(--cream-soft);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.quietline a:hover{color:var(--gold)}
.quietline a[hidden]{display:none}
.resultcard p{color:var(--cream-soft);font-size:.95rem}
.resultcard p+p{margin-top:.7rem}
/* the two labels were .62rem faint caps and read as furniture. Rachel asked for
   them noticeably larger, because they are what makes the bars mean anything. */
.pointlegend{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:.2rem 0 1.1rem;padding-left:calc(10px + .8rem)}
.pointlegend .dragside{color:var(--drag-l)}
.pointlegend .liftside{color:var(--gold)}

   its own line under the label so nothing ever wraps at any width. */
.pointrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"dot nm val" ". bar bar";align-items:center;column-gap:.8rem;row-gap:.5rem;padding:.7rem 0}
.pointrow .dot{grid-area:dot;width:10px;height:10px;border-radius:50%}
.pointrow .nm{grid-area:nm;display:block;min-width:0;font-size:.86rem;font-weight:600}
.pointrow .nm b{display:block;font-weight:600;white-space:nowrap}
.pointrow .nm small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.01em;color:var(--cream-faint);margin-top:.12rem;white-space:nowrap}
.pointrow .bibar{grid-area:bar;position:relative;height:8px;background:var(--rule-l);border-radius:4px}
.pointrow .bibar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(243,239,231,.45)}
.pointrow .bibar i{position:absolute;top:0;bottom:0;border-radius:4px;transform:scaleX(0);transition:transform 1.1s cubic-bezier(.22,.9,.35,1)}
.pointrow .val{grid-area:val;width:2.4rem;text-align:right;font-size:.86rem;font-weight:700;color:var(--cream)}
.bridge{border-color:rgba(184,146,74,.45)}
.tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--gold);margin-top:1rem}
.ctabtn{display:inline-block;margin-top:1.3rem;font-weight:700;text-decoration:none;text-align:center;color:var(--navy-deep);background:var(--gold);border-radius:3px;padding:.9rem 1.9rem;transition:background .2s}
.ctabtn:hover{background:var(--gold-deep);color:var(--cream)}
.fgline{margin:1rem 0 0}
.fgline a{color:var(--gold);font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.fgline a:hover{color:var(--cream)}
/* an accidental visitor has to be able to tell this is not their result */
.previewflag{margin:0 0 1.6rem;padding:.7rem .9rem;border:1px solid var(--gold);border-left-width:4px;border-radius:3px;background:rgba(184,146,74,.12);color:var(--cream);font-size:.86rem;line-height:1.5}
.draftnote{max-width:34rem;margin:2.6rem auto 0;text-align:center;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:1rem;color:var(--cream-soft);line-height:1.6}
.footnote{font-size:.78rem;color:var(--cream-faint);text-align:center;margin-top:1.1rem}
/* ⛔ 28 Sept 2026. A two-column grid used to kick in here. With four cards of
   unequal height it left big empty holes on one side and orphaned the centred
   paragraphs in the middle of them. One column, one rhythm, every width. */
@media (min-width:900px){
  #result .wrap{max-width:44rem}
  #result .wheelbox{margin-left:auto;margin-right:auto;max-width:27rem}
}
@media (max-width:480px){
  .pole{font-size:.9rem}
  .pointrow .nm b{font-size:.82rem}
  .btn{padding:.9rem 1.35rem;font-size:.95rem}
  .backbtn{padding:.9rem 1rem;font-size:.85rem}
  .partnav{flex-wrap:wrap;justify-content:flex-end}
  .navbtns{gap:.5rem}
}
@media (prefers-reduced-motion:reduce){
  .pointrow .bibar i{transition:none}
}

/* ---------- scoring (from capacity.js, unchanged logic) ---------- */
const FACTORS = ["biology", "behaviour", "environment", "leadership"];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sum = (a) => a.reduce((t, v) => t + v, 0);
function stdev(values){ const mean = sum(values)/values.length; return Math.sqrt(sum(values.map(v=>(v-mean)**2))/values.length); }
function bandFor(score, bands){ return bands.reduce((hit,b)=>(score>=b.min?b:hit), bands[0]).name; }
function computeCapacity(inputs, source, config){
  const s = config.scoring, scale = config.instrument.scale;
  const perFactor = config.instrument.parts.find(p=>p.factor==="biology").statements.length;
  const partDrag={}, subscores={}; let complete=true;
  for(const f of FACTORS){
    const answers=(inputs[f]||[]).filter(v=>Number.isFinite(v));
    if(answers.length<perFactor) complete=false;
    const drag=sum(answers); partDrag[f]=drag;
    const floor=perFactor*scale.min;
    subscores[f]=clamp(Math.round((100*(floor+s.factorDivisor-drag))/s.factorDivisor),0,100);
  }
  const totalDrag=sum(FACTORS.map(f=>partDrag[f]));
  const dragFloor=FACTORS.length*perFactor*scale.min;
  let capacityScore=clamp(Math.round((100*(dragFloor+s.capacityDivisor-totalDrag))/s.capacityDivisor),0,100);
  const coherence=clamp(1-stdev(FACTORS.map(f=>subscores[f]))/s.coherenceDivisor,0,1);
  if(s.coherenceAffectsScore) capacityScore=clamp(Math.round(capacityScore*(s.coherenceBase+s.coherenceCoefficient*coherence)),0,100);
  const [a,b]=s.pushLever.compare;
  const pushLever=partDrag[a]===partDrag[b]?s.pushLever.tieBreak:(partDrag[a]>partDrag[b]?a:b);
  const confidence=!complete?"low":(source==="assessment"?"medium":"high");
  return { capacityScore, subscores, coherence, band:bandFor(capacityScore,s.bands), confidence,
    version:config.version, totalDrag, partDrag, dragBand:bandFor(totalDrag,s.dragBands), pushLever, complete };
}

function wireSlider(el, factor, si){
  const track = el.querySelector(".track");
  const fill = el.querySelector(".fill");
  const knob = el.querySelector(".knob");
  const poleL = el.querySelector(".pole.left");
  const poleR = el.querySelector(".pole.right");

  function paint(v){
    v = Math.max(-2, Math.min(2, v));
    const pct = v * 25; // -50..50
    knob.style.left = (50 + pct) + "%";
    if (pct >= 0){ fill.style.left = "50%"; fill.style.right = "auto"; fill.style.width = pct + "%"; fill.style.background = "var(--gold)"; }
    else { fill.style.right = "50%"; fill.style.left = "auto"; fill.style.width = (-pct) + "%"; fill.style.background = "var(--drag-l)"; }
    const lift = v > 0.15, drag = v < -0.15;
    knob.classList.toggle("lift", lift);
    poleR.classList.toggle("dim", drag);
    poleL.classList.toggle("dim", lift);
    // hollow ring until this one is actually answered (see .knob.untouched)
    const touched = rawV[factor][si] != null;
    knob.classList.toggle("untouched", !touched);
    if (touched) { track.setAttribute("aria-valuenow", String(v)); }
    else { track.removeAttribute("aria-valuenow"); }
  }
  function commit(v){
    // FIVE POSITIONS, not a fluid slider (Rachel, 7 Aug: "I never needed a fully
    // fluid slider. It's okay if it's more 5 points. One on each end, one in the
    // middle and two on either side."). Snapping to -2..2 also removes the source
    // of the decimals that silently broke the database write for three weeks.
    v = Math.max(-2, Math.min(2, Math.round(v)));
    rawV[factor][si] = v;
    answers[factor][si] = dragFromV(v);
    paint(v);
    $("answerHint").classList.remove("show");
  }
  function fromEvent(e){
    const r = track.getBoundingClientRect();
    const rel = (e.clientX - r.left) / r.width; // 0..1
    commit((rel - 0.5) * 4);
  }
  let dragging = false;
  track.addEventListener("pointerdown", (e)=>{ dragging=true; track.setPointerCapture(e.pointerId); fromEvent(e); });
  track.addEventListener("pointermove", (e)=>{ if(dragging) fromEvent(e); });
  track.addEventListener("pointerup", ()=>{ dragging=false; });
  track.addEventListener("keydown", (e)=>{
    const cur = rawV[factor][si] == null ? 0 : rawV[factor][si];
    if(e.key==="ArrowRight"||e.key==="ArrowUp"){ commit(cur+0.2); e.preventDefault(); }
    else if(e.key==="ArrowLeft"||e.key==="ArrowDown"){ commit(cur-0.2); e.preventDefault(); }
    else if(e.key==="Home"){ commit(-2); e.preventDefault(); }
    else if(e.key==="End"){ commit(2); e.preventDefault(); }
  });

  // restore prior position (going back) or show neutral untouched
  if (rawV[factor][si] != null) paint(rawV[factor][si]);
  else paint(0);
}

/* ⛔ ONE DERIVATION of which part is weakest and which is strongest, 28 Sept
   2026. The result screen and the Kit payload both need them, and they were
   sorting the subscores separately. A second derivation is exactly how the
   email and the screen drifted apart before, so both call this. */
function rankFactors(r){
  const sorted = Object.entries(r.subscores || {}).sort((a, b) => a[1] - b[1]);
  return { sorted: sorted, lowest: sorted[0], highest: sorted[sorted.length - 1] };
}

/* ---------- Kit (ConvertKit) subscribe: email + capacity state + heaviest point ---------- */
function subscribeToKit(email, firstName, r){
  if (!email || !config.kit || !config.kit.formId) return;
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
  const lever = cap(r.pushLever);
  // heaviest_point = the factor dragging hardest across all four (matches the reveal's
  // "Dragging hardest" line; can be Leadership/Biology). push_lever = the pushable lever
  // (behaviour/environment). The email names BOTH: name the drag, push the lever.
  const rank = rankFactors(r);
  const heaviest = rank.lowest ? cap(rank.lowest[0]) : lever;
  // lifting_most = the STRONGEST part. Peak's copy names it ("Right now the part
  // lifting you most is X"), and without this field a Peak email written against
  // it renders empty or prints the raw merge tag at every Peak subscriber.
  const lifting = rank.highest ? cap(rank.highest[0]) : "";
  const body = new URLSearchParams();
  body.set("email_address", email);
  // Always send something. The results email greets by name with a bare
  // {{ subscriber.first_name }} tag (Liquid `default:` filters break when Kit
  // escapes the quotes inside them), so an empty value would read "Hi ,".
  body.set("fields[first_name]", firstName || "there");
  body.set("fields[capacity_state]", r.band || "");
  body.set("fields[heaviest_point]", heaviest);
  body.set("fields[push_lever]", lever);
  body.set("fields[lifting_most]", lifting);
  // and the descriptor for it, from copy.quadrants, so the email can explain the
  // part instead of just naming it and never re-words it locally
  body.set("fields[lifting_most_desc]", (C.quadrants && rank.highest && C.quadrants[rank.highest[0]]) || "");
  body.set("fields[capacity_score]", String(r.capacityScore ?? ""));
  // full per-factor answer set (raw slider values), so the results portal has every answer, not just the outcome
  const detail = FACTORS.map(f => cap(f) + ": " + ((answers[f] || []).map(v => Number.isFinite(v) ? v : "-").join("/"))).join("  |  ");
  body.set("fields[answers_detail]", detail);

  // ── THEIR PAIN, IN THEIR OWN WORDS (7 Aug 2026) ────────────────────────────
  // Rachel: "we must be able to use their pain points for the sales process,
  // otherwise our process limps along." answers_detail is raw digits, which is
  // useless as email copy. These carry the actual statements they dragged
  // hardest, so the results email and a sales conversation can quote the person
  // back to themselves instead of naming a factor.
  const pains = [];
  (config.instrument.parts || []).forEach(part => {
    (part.statements || []).forEach((text, i) => {
      const v = (answers[part.factor] || [])[i];
      // fillTokens, or the sales email quotes a sentence with a {whoNeeds} in it.
      if (Number.isFinite(v)) pains.push({ text: fillTokens(text), drag: v });
    });
  });
  pains.sort((a, b) => b.drag - a.drag);          // highest drag first
  const top = pains.filter(p => p.drag >= 3).slice(0, 3);   // only genuine drag
  top.forEach((p, i) => body.set(`fields[top_pain_${i + 1}]`, p.text));
  for (let i = top.length; i < 3; i++) body.set(`fields[top_pain_${i + 1}]`, "");
  // One preformatted block so a single merge tag can drop the whole thing in.
  body.set("fields[top_pains]", top.map(p => "• " + p.text).join("\n"));
  body.set("fields[top_pain_count]", String(top.length));

  // Which way the wheel is turning, in Rachel's framing (7 Aug): "right now your
  // wheel is pulling to the left, by default, or right, by design." Ties the
  // result back to the same idea as the post: default is what runs when there is
  // no capacity to choose. capacityScore is 0-100 where HIGH = good, so a score
  // at or below the midpoint is being run by default rather than by design.
  // Rachel, 7 Aug: "rotating to the left means it's eroding capacity, draining,
  // depleting. Rotating to the right is helping to build capacity, to give
  // energy. We just need to clarify that." So the field states the CONSEQUENCE,
  // not just the direction. "By default" on its own does not tell anyone they
  // are losing capacity.
  // ★ DERIVE THIS FROM THE BAND, NOT A SEPARATE THRESHOLD (7 Aug 2026).
  // It used to be capacityScore > 50, which is a different cut to the band
  // boundaries. Rachel scored 66: above 50, so the email masthead said "turning
  // to the right, building capacity", while her band was Conserve so the body
  // said "turning to the left, draining your capacity". The same email
  // contradicting itself in two places. Tying both to the band makes that
  // impossible by construction.
  // THREE directions, not two (Rachel, 7 Aug): "Perhaps the wheel is not
  // spinning at all. They're not building but they're not losing." Steady is
  // genuinely a third state, so it must not claim to be building.
  var PULL = {
    Restore:  ["to the left, draining capacity",   "left",  "draining capacity", "by default"],
    Conserve: ["to the left, draining capacity",   "left",  "draining capacity", "by default"],
    // ⛔ STEADY IS A MARGINAL GAIN, NOT A LOSS (Rachel, 18 Sept 2026). This used
    // to say "edging backwards without you noticing", which flatly contradicted
    // the wheel drawn beside it: the arc spins clockwise for Steady. Her ruling:
    // "Steady should be a very fractionally clockwise spin. Only marginal.
    // They're just at capacity now but any big changes in their environment or
    // leadership requirements would offset the marginal gain to default
    // backwards." So the email says right, and narrow, and conditional.
    Steady:   ["to the right, but only just",      "right", "holding at capacity", "by a fine margin"],
    Peak:     ["to the right, building capacity",  "right", "building capacity", "by design"],
  };
  var pull = PULL[r.band] || PULL.Steady;
  body.set("fields[wheel_pull]", pull[0]);
  body.set("fields[wheel_direction]", pull[1]);
  body.set("fields[wheel_effect]", pull[2]);
  body.set("fields[wheel_pull_short]", pull[3]);

  // ── TAG BY STATE (7 Aug 2026) ─────────────────────────────────────────────
  // Kit sequences are drip campaigns: only the FIRST email can send
  // "immediately", every later one waits hours or days behind it. So three
  // emails in one sequence would make a Steady reader wait a day and a Peak
  // reader two days for their own results. Unacceptable for a results email.
  //
  // Instead each state gets its own single-email sequence, triggered by a tag.
  // Verified 7 Aug that the PUBLIC form endpoint accepts tags[] without an API
  // key: a test submission carrying tag 22266620 came back tagged "Wheel: Peak".
  var KIT_STATE_TAGS = {
    Restore:  "22266617",
    Conserve: "22266618",
    Steady:   "22266619",
    Peak:     "22266620",
  };
  body.set("fields[carry]", carryKey);
  body.set("fields[carry_label]", carryOption().label);
  var stateTag = KIT_STATE_TAGS[r.band];
  if (stateTag) body.set("tags[]", stateTag);
  fetch(`https://app.kit.com/forms/${config.kit.formId}/subscriptions`, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  }).catch(()=>{});
}

/* ---------- storage: Supabase insert + local backup ---------- */
function storeResponse(email, firstName, r){
  const row = {
    email: email || null, first_name: firstName || null,
    // total_drag is an INTEGER column. The slider went continuous on 21 Jul and
    // started sending decimals, so every insert since has 400'd with
    // 'invalid input syntax for type integer' and the .catch below ate it
    // silently. Full precision is kept in answers/part_totals, which are jsonb.
    answers, part_totals: r.partDrag, total_drag: Math.round(r.totalDrag),
    capacity_score: r.capacityScore, subscores: r.subscores,
    coherence: +r.coherence.toFixed(4), band: r.band, push_lever: r.pushLever,
    carry: carryKey,
    config_version: config.version, user_agent: navigator.userAgent.slice(0,300),
  };
  try {
    const key = config.storage.localStorageKey;
    const prev = JSON.parse(localStorage.getItem(key) || "[]");
    prev.push({ ...row, at: new Date().toISOString() });
    localStorage.setItem(key, JSON.stringify(prev));
  } catch {}
  if (config.storage.endpoint) {
    // BULLETPROOFING (7 Aug 2026). A single fire-and-forget POST with a silent
    // catch lost every response from 21 Jul to 7 Aug and nobody could tell,
    // because the visitor's screen looks identical whether it saved or not.
    // Now: retry twice with backoff, and if it still fails, park the row in
    // localStorage under a pending queue that the next visit flushes. The
    // visitor never sees any of this.
    postWithRetry(row, 0);
  }
}

const PENDING_KEY = "capacity_pending_v1";

function postWithRetry(row, attempt) {
  fetch(config.storage.endpoint, {
    method: "POST",
    headers: { "Content-Type":"application/json", apikey: config.storage.apiKey, Authorization: "Bearer "+config.storage.apiKey, Prefer:"return=minimal" },
    body: JSON.stringify(row),
  }).then(res => {
    if (res.ok) return;
    return res.text().then(t => {
      console.error("[capacity] store failed", res.status, t);
      // A 4xx is our bug and will fail identically on retry, so park it at once.
      if (res.status >= 400 && res.status < 500) return park(row);
      if (attempt < 2) return setTimeout(() => postWithRetry(row, attempt + 1), 800 * (attempt + 1));
      park(row);
    });
  }).catch(e => {
    console.error("[capacity] store unreachable", e);
    if (attempt < 2) setTimeout(() => postWithRetry(row, attempt + 1), 800 * (attempt + 1));
    else park(row);
  });
}

function park(row) {
  try {
    const q = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
    q.push({ ...row, parked_at: new Date().toISOString() });
    localStorage.setItem(PENDING_KEY, JSON.stringify(q.slice(-20)));
    console.warn("[capacity] response parked for later flush");
  } catch {}
}

// Flush anything parked by an earlier visit. Runs once on load, best effort.
function flushPending() {
  let q;
  try { q = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return; }
  if (!q.length || !config.storage.endpoint) return;
  localStorage.removeItem(PENDING_KEY);
  q.forEach(r => { const { parked_at, ...row } = r; postWithRetry(row, 1); });
}

try { flushPending(); } catch {}

/* ---------- the OPENING diagram ----------
   ⛔ ONE SOURCE OF TRUTH FOR THE GEOMETRY. This draws from config.wheel
   factorAngles and factorOrder, the same fields buildWheel() uses and the same
   positions as the diagram published on taylored.health:

     Environment 9 o'clock (270)   Biology 12 (0)   Leadership 3 (90)   Behaviour 6 (180)

   polar() puts 0 at the top and increases CLOCKWISE, so walking factorOrder
   (biology 0, leadership 90, behaviour 180, environment 270) walks the circle
   clockwise. That is the SAME cycle as Rachel's published build direction
   entered one handle later:

     CLOCKWISE = BUILDS   Environment -> Biology -> Leadership -> Behaviour -> Environment

   ⛔ The arrows are NOT decoration. Direction is the meaning
   ([[reference_capacity_wheel_order]]), so this diagram turns clockwise
   because the opening screen is an invitation to build, and the result wheel
   is the thing that later tells you which way yours is actually going.
   ⛔ Do NOT place the four by the order they are listed in a brief. Her prose
   is not the authority on her model, the published diagram is, and a listing
   order would put Behaviour at 3 and Leadership at 9.
   ⛔ Do NOT draw BEING / DOING arcs here. She removed them on 15 Sept 2026. */
function buildIntroWheel(){
  const svg = $("introWheel");
  if (!svg) return;
  const R = 132, NODE = 176;
  const order = W.factorOrder;                 // clockwise by construction
  const ang = (f) => ((W.factorAngles[f] % 360) + 360) % 360;

  // the ring the four sit on
  let out = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(184,146,74,.22)" stroke-width="1.5"/>`;

  // ONE connector per consecutive pair, drawn clockwise with the head at the
  // far end, so the eye is told these four move each other and which way round.
  const GAP = 26, HEAD = 9, hw = 6.5, gold = "#b8924a";
  for (let i = 0; i < order.length; i++){
    const a = ang(order[i]);
    let b = ang(order[(i + 1) % order.length]);
    if (b <= a) b += 360;                      // always step forwards
    const from = a + GAP, to = b - GAP;
    out += `<path d="${arcPath(R, from, to - HEAD)}" fill="none" stroke="${gold}" stroke-opacity=".62" stroke-width="2" stroke-linecap="round"/>`;
    const [tx, ty] = polar(R, to);
    const [ox, oy] = polar(R + hw, to - HEAD);
    const [ix, iy] = polar(R - hw, to - HEAD);
    out += `<path d="M ${tx.toFixed(2)} ${ty.toFixed(2)} L ${ox.toFixed(2)} ${oy.toFixed(2)} L ${ix.toFixed(2)} ${iy.toFixed(2)} Z" fill="${gold}" fill-opacity=".85"/>`;
  }

  // the hub. Capacity is the ROTATION, not a fifth handle, so it is named at
  // the centre and never given a spoke.
  out += `<circle cx="${CX}" cy="${CY}" r="52" fill="rgba(184,146,74,.08)" stroke="rgba(184,146,74,.45)" stroke-width="1.5"/>`
       + `<text x="${CX}" y="${CY - 2}" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="25" fill="#f3efe7">${I.model.hub}</text>`
       + `<text x="${CX}" y="${CY + 20}" text-anchor="middle" font-family="Manrope,sans-serif" font-size="11" letter-spacing="1.6" fill="#8a9aa1">${I.model.hubSub}</text>`;

  // the four handles: a dot ON the ring and the NAME just outside it, both in
  // the svg so they scale with the diagram and never drift from the geometry.
  // ⛔ The blurbs stay in HTML underneath: text inside an svg does not wrap, and
  // hand-wrapping a sentence into tspans breaks the moment the wording changes.
  out += order.map((f)=>{
    const a = ang(f), [dx, dy] = polar(R, a), [lx, ly] = polar(NODE, a);
    const anchor = a === 90 ? "start" : a === 270 ? "end" : "middle";
    const dy2 = a === 0 ? -8 : a === 180 ? 18 : 5;
    const px = a === 90 ? lx + 4 : a === 270 ? lx - 4 : lx;
    return `<circle cx="${dx.toFixed(2)}" cy="${dy.toFixed(2)}" r="7" fill="${W.factorColors[f]}"/>`
         + `<text x="${px.toFixed(2)}" y="${(ly + dy2).toFixed(2)}" text-anchor="${anchor}"`
         + ` font-family="Manrope,sans-serif" font-size="14" font-weight="700" letter-spacing="2.2"`
         + ` fill="${W.factorColors[f]}">${W.factorLabels[f].toUpperCase()}</text>`;
  }).join("");

  svg.innerHTML = out;

  // ⛔ FIT THE VIEWBOX TO WHAT WAS ACTUALLY DRAWN. The side labels sit outside
  // the 440 box and were clipped at 375px, rendering as "ONMENT" and "LEADER".
  // Measuring the rendered content instead of guessing a wider box means nothing
  // clips however the labels or the font change later.
  try {
    const bb = svg.getBBox();
    if (bb.width > 0 && bb.height > 0) {
      const pad = 6;
      svg.setAttribute("viewBox",
        (bb.x - pad).toFixed(1) + " " + (bb.y - pad).toFixed(1) + " " +
        (bb.width + pad * 2).toFixed(1) + " " + (bb.height + pad * 2).toFixed(1));
    }
  } catch (e) { /* no layout yet: the 440 box still renders, just tighter */ }

  // ⛔ ONE set of nodes, TWO layouts. On a wide screen they sit around the ring
  // in their real positions, so the model reads in one look. On a phone the
  // same nodes stack in the same clockwise order underneath it. Never a second
  // list, because a second list is how the diagram and the words drift apart.
  $("modelKey").innerHTML = order.map((f)=>{
    const part = I.parts.find((x)=>x.factor === f);
    const kind = part ? part.kind : "outcome";
    return `<div class="node">
      <span class="nodename" style="color:${W.factorColors[f]}">
        <i class="nodedot" style="background:${W.factorColors[f]}"></i>${W.factorLabels[f]}</span>
      <span class="nodeblurb">${(C.quadrants && C.quadrants[f]) || ""}</span>
      <span class="nodecue ${kind}">${I.model.cues[kind]}</span>
    </div>`;
  }).join("");
  $("modelCaption").textContent = I.model.caption;

  // the diagram is the argument, so a screen reader has to get the loop too
  $("introWheelDesc").textContent =
    "The Capacity Wheel. Capacity sits at the centre and is the rotation. Four parts sit around it and feed each other clockwise: "
    + order.map((f)=>W.factorLabels[f]).join(", then ") + ", and back to " + W.factorLabels[order[0]] + ".";
}

/* ---------- the wheel (unchanged dark reveal) ---------- */
const CX = 220, CY = 220;
const polar = (r, deg) => { const a=(deg*Math.PI)/180; return [CX + r*Math.sin(a), CY - r*Math.cos(a)]; };
function arcPath(r, a1, a2){ const [x1,y1]=polar(r,a1),[x2,y2]=polar(r,a2); return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; }
const lerp = (a,b,t)=>a+(b-a)*t;
function speedFor(score){ const m=W.spinSpeedMap; if(score<=m[0].score) return m[0].dps; for(let i=1;i<m.length;i++) if(score<=m[i].score) return lerp(m[i-1].dps,m[i].dps,(score-m[i-1].score)/(m[i].score-m[i-1].score)); return m[m.length-1].dps; }
const easings = { easeOutCubic:(t)=>1-(1-t)**3, linear:(t)=>t };

function renderResult(r){
  $("r-kicker").textContent = C.scoreCaption;
  $("r-heading").textContent = C.resultHeading;
  $("r-band").textContent = r.band;
  $("r-scoreMeans").textContent = C.scoreMeans.replace("{score}", String(r.capacityScore));
  $("r-read").textContent = C.bandReads[r.band];
  const rank = rankFactors(r);
  const sorted = rank.sorted, lowest = rank.lowest, highest = rank.highest;
  // only claim a drag when the weakest axis is genuinely below the midline;
  // otherwise name the strongest lift so the line stays honest for Peak/Steady
  // ⛔ 28 Sept 2026: "Lifting most right now: Environment" was read as an
  // instruction to go and lift that area, and took twenty seconds to unpick.
  // ⛔ The quadrant name alone does not tell anyone what the quadrant IS, so the
  // descriptor sits under it, read from C.quadrants and from nowhere else.
  const leakFactor = lowest[1] < 50 ? lowest[0] : highest[0];
  $("r-leak").innerHTML =
    '<span class="leaklead">' + (lowest[1] < 50 ? "Dragging hardest right now: " : "Holding you up right now: ")
    + W.factorLabels[leakFactor] + '</span>'
    + '<span class="leakdesc">' + ((C.quadrants && C.quadrants[leakFactor]) || "") + '</span>';
  $("r-pointsHeading").textContent = C.partBreakdownHeading;
  // bidirectional point-by-point: centre line, fill left (drag) or right (lift), factor colour kept
  $("pointRows").innerHTML = W.factorOrder.map((f)=>{
    const sub = r.subscores[f];
    const signed = (sub - 50) / 50;         // -1 full drag .. +1 full lift
    const lift = signed >= 0;
    // ⛔ 18 Sept: a subscore of EXACTLY 50 computed a width of 0, so the row
    // drew a bare centre line with no mark on it and read as a rendering
    // fault rather than as "this one is level". Rachel's Biology was 50 and
    // she flagged the alignment. A floor of 1.5% gives level its own visible
    // nub, distinct from both a drag and a lift.
    const w = Math.max(1.5, Math.min(50, Math.abs(signed) * 50)).toFixed(1);
    // fixed target width; animate scaleX from the centre outward (origin at the centre line)
    // round only the outer/measurement end; keep the centre-line end square
    const side = lift ? `left:50%;transform-origin:left;border-radius:0 4px 4px 0;` : `right:50%;left:auto;transform-origin:right;border-radius:4px 0 0 4px;`;
    // ⛔ 28 Sept 2026. The rows used to say Biology / Behaviour / Environment /
    // Leadership, but people answer under "Your state", "What you do", "What
    // surrounds you", "How pressure shows up". Changing vocabulary on the score
    // sheet cost a reader the whole breakdown: "I don't really understand
    // biology... leadership I don't fully understand how to move the needle."
    // The plain title leads, the model word sits smaller underneath. The wheel
    // diagram keeps the model words: the diagram is the authority.
    const part = I.parts.find((p)=>p.factor===f);
    // ⛔ 28 Sept 2026, Rachel: "I think its everywhere. Let's align and stick to
    // it." The descriptor under each row comes from C.quadrants, the ONE home
    // for those four strings. The heading stays the title the reader answered
    // under, which was her ruling this morning.
    // ⚠ behaviour's title and its descriptor are the SAME words, "What you do",
    // so rendering both would print the line twice. Show it once.
    const title = part ? part.title : W.factorLabels[f];
    const desc = (C.quadrants && C.quadrants[f]) || "";
    const rowDesc = desc && desc.toLowerCase() !== title.toLowerCase() ? desc : "";
    return `<div class="pointrow">
      <span class="dot" style="background:${W.factorColors[f]}"></span>
      <span class="nm"><b>${title}</b>${rowDesc ? `<small>${rowDesc}</small>` : ""}</span>
      <span class="bibar"><span class="mid"></span><i style="${side}width:${w}%;background:${W.factorColors[f]}"></i></span>
      <span class="val">${sub}</span>
    </div>`;
  }).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".pointrow .bibar i").forEach((el)=>{ el.style.transform = "scaleX(1)"; });
  }));
  // ---- next steps: the reader's OWN weakest part, not a generic habit line ----
  const titleOf = (f)=>{ const p = I.parts.find((x)=>x.factor===f); return p ? p.title : W.factorLabels[f]; };
  const lowerFirst = (s)=> s.charAt(0).toLowerCase() + s.slice(1);
  const NS = C.nextSteps;
  $("r-leverHeading").textContent = NS.heading;
  $("r-leverBody").textContent = (NS.byBand[r.band] || NS.byBand.Steady)
    .replace("{low}", lowerFirst(titleOf(lowest[0])))
    .replace("{high}", lowerFirst(titleOf(highest[0])));
  // Peak's job is to hold what is working, so it gets no "fix this part" action.
  const actionFactor = r.band === "Peak" ? null : lowest[0];
  $("r-leverAction").textContent = actionFactor ? (NS.byFactor[actionFactor] || "") : "";
  $("r-leverAction").hidden = !actionFactor;
  // Plain-English band label, directly under the chip (Rachel, 27 Sept 2026):
  // "someone understands their result before they've read a paragraph".
  $("r-bandLabel").textContent = (C.bandLabels && C.bandLabels[r.band]) || "";
  // ★ COHERENCE IS READ, NOT SCORED. `coherence` has always been computed
  // (it already drives the wheel wobble); `coherenceAffectsScore` stays FALSE
  // on purpose. Turning that on multiplies every score by 0.85-1.0, which
  // would silently restate every past result. Showing it needs no such change.
  // ⛔ 28 Sept 2026: an even wheel gets ONE line under the map. Only an uneven
  // one gets the tab, and the tab opens closed.
  const even = r.coherence >= C.coherence.evenThreshold;
  $("r-evenLine").textContent = C.coherence.evenLine
    + ((C.coherence.evenLineLowBands || []).indexOf(r.band) > -1 ? " " + C.coherence.evenLineLow : "");
  $("r-evenLine").hidden = !even;
  $("r-cohTab").hidden = even;
  $("r-cohTab").open = false;
  $("r-cohHeading").textContent = C.coherence.heading;
  $("r-cohIntro").textContent = C.coherence.intro;
  $("r-cohRead").textContent = C.coherence.uneven;
  $("r-pointsSub").textContent = C.partBreakdownSub;
  renderCtas(r.band);
  $("r-bridgeHeading").textContent = C.bridge.heading;
  $("r-bridgeBody").textContent = C.bridge.body;
  $("r-tagline").textContent = C.bridge.tagline;
  $("r-cta").textContent = C.bridge.ctaLabel;
  $("r-cta").href = C.bridge.ctaUrl;
  $("r-fg").textContent = C.bridge.fieldGuideLabel;
  $("r-fg").href = C.bridge.fieldGuideUrl;
  $("r-draftnote").textContent = C.bridge.draftNote;
  $("r-footnote").textContent = C.bridge.footnote;
  buildWheel(r);
}

/* ---------- band-matched calls to action ----------
   ⛔ 28 Sept 2026. "Talk through my result" used to be the only road out, on a
   gold button, for everyone. Someone who lands in Peak or Steady has just told
   the screen they do not have a problem, so a consultation button is the wrong
   primary action and reads as a pitch. Peak shares, Steady sets a return, and
   only Conserve and Restore get the talk button. The talk link never
   disappears, it just stops being the loudest thing on the screen.

   ⚠ The share is COPY TO CLIPBOARD with a mailto underneath, not mailto first.
   On most work machines the default mail client is unset and a mailto click
   dies silently with no error the person can see. */
function renderCtas(band){
  const T = C.ctas;
  const copyBtn = $("r-copyBtn"), talkBtn = $("r-talkBtn"),
        mailLink = $("r-mailLink"), talkLink = $("r-talkLink"), note = $("r-copyNote");
  const share = band === "Peak", ret = band === "Steady", quiet = share || ret;
  note.textContent = "";

  copyBtn.hidden = !quiet;
  copyBtn.textContent = share ? T.shareLabel : T.returnLabel;
  copyBtn.dataset.done = share ? T.copiedShare : T.copiedReturn;
  // only the long label gets shrunk to stay on one line, so the short ones are
  // not needlessly small (see .ctablock .ctabtn.longlabel)
  copyBtn.classList.toggle("longlabel", copyBtn.textContent.length > 30);
  talkBtn.classList.toggle("longlabel", T.talkLabel.length > 30);

  talkBtn.hidden = quiet;
  talkBtn.textContent = T.talkLabel;
  talkBtn.href = T.talkUrl;
  talkBtn.target = "_blank"; talkBtn.rel = "noopener";

  mailLink.hidden = !share;
  mailLink.textContent = T.mailLabel;
  mailLink.href = "mailto:?subject=" + encodeURIComponent(T.mailSubject) + "&body=" + encodeURIComponent(T.mailBody);
  mailLink.parentElement.hidden = !share;

  talkLink.hidden = !quiet;
  talkLink.textContent = T.talkLabel;
  talkLink.href = T.talkUrl;
  talkLink.target = "_blank"; talkLink.rel = "noopener";
  talkLink.parentElement.hidden = !quiet;
}

$("r-copyBtn").addEventListener("click", function(){
  const done = this.dataset.done || C.ctas.copiedShare;
  const say = (msg)=>{ $("r-copyNote").textContent = msg; };
  // navigator.clipboard is absent on http and blocked in some embedded views,
  // so the textarea fallback is not optional.
  const fallback = ()=>{
    try {
      const ta = document.createElement("textarea");
      ta.value = C.ctas.shareUrl;
      ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      say(ok ? done : C.ctas.copyFailed);
    } catch (e) { say(C.ctas.copyFailed); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(C.ctas.shareUrl).then(()=>say(done)).catch(fallback);
  } else { fallback(); }
});

function buildWheel(r){
  const svg = $("wheel");
  // the arrow IS the meaning, so a screen reader has to get the direction too
  const spinWord = r.band === "Peak" ? "turning forwards"
    : r.band === "Steady" ? "turning forwards, only just"
    : "turning backwards";
  svg.setAttribute("aria-label", `Capacity wheel. Score ${r.capacityScore} out of 100, band ${r.band}, ${spinWord}.`);
  const half = W.sectorSpanDegrees/2, R = W.arcRadius;
  const spokes = W.factorOrder.map((f)=>{ const a=W.factorAngles[f]; const [x2,y2]=polar(104,a);
    return `<line x1="${CX}" y1="${CY}" x2="${x2}" y2="${y2}" stroke="${W.spokeColor}" stroke-width="2"/><circle cx="${x2}" cy="${y2}" r="5" fill="${W.factorColors[f]}"/>`; }).join("");
  const ticks = Array.from({length:24},(_,i)=>{ const [x1,y1]=polar(88,i*15),[x2,y2]=polar(96,i*15);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${W.spokeColor}" stroke-width="1.4"/>`; }).join("");
  // ONE bold spin arrow: which way the WHOLE wheel is turning.
  //
  // ⛔ 18 Sept 2026. This used to read `capacityScore >= 50`, a SEPARATE rule
  // from the one the copy uses. Steady starts at exactly 50, so every Steady
  // result drew a confident clockwise "building" sweep while the paragraph
  // underneath said "it is edging backwards". Rachel scored 64 with all four
  // subscores at or above centre and the page told her she was going backwards.
  // Her words: "blatantly untrue".
  //
  // The arrow now reads THE BAND, the same source the copy reads, so the two
  // can never disagree again. Three directions, matching the three she set in
  // August (left / stalling / right):
  //
  //   Peak              full clockwise      actively building
  //   Steady            MARGINAL clockwise  at capacity, only just gaining
  //   Conserve/Restore  anticlockwise       draining
  //
  // Her ruling on Steady, 18 Sept: "a very fractionally clockwise spin. Only
  // marginal. They're just at capacity now but any big changes in their
  // environment or leadership requirements would offset the marginal gain to
  // default backwards." So Steady is a SHORT arc, not a long one: the direction
  // is right but there is visibly almost nothing in it.
  const building = r.band === "Peak" || r.band === "Steady";
  const marginal = r.band === "Steady";
  const spin = building ? 1 : -1;
  const gap=38, headDeg=13, hw=15, sw=11, gold="#b8924a";
  const lead = spin>0 ? 360-gap : gap;                 // arrowhead angle
  // The ARROWHEAD stays where it always was, so every state is read the same
  // way round; only the TAIL is shortened for Steady. Moving the head instead
  // (the first attempt) slid the whole arc to the far side of the wheel and a
  // marginal clockwise spin ended up pointing anticlockwise.
  const fullSpan = 360 - 2*gap - headDeg;
  const span = marginal ? 70 : fullSpan;               // 70deg reads as "only just"
  const [ba0,ba1] = spin>0
    ? [lead - headDeg - span, lead - headDeg]          // clockwise: head at the high end
    : [lead + headDeg, lead + headDeg + span];         // anticlockwise: head at the low end
  const [tx,ty]=polar(R, lead);
  const baseA = spin>0 ? lead-headDeg : lead+headDeg;
  const [ox,oy]=polar(R+hw, baseA), [ix,iy]=polar(R-hw, baseA);
  const spinArrow = `<g class="spinarrow">`
    + `<path d="${arcPath(R,ba0,ba1)}" fill="none" stroke="${gold}" stroke-width="${sw}" stroke-linecap="round"/>`
    + `<path d="M ${tx.toFixed(2)} ${ty.toFixed(2)} L ${ox.toFixed(2)} ${oy.toFixed(2)} L ${ix.toFixed(2)} ${iy.toFixed(2)} Z" fill="${gold}"/>`
    + `</g>`;
  const labels = W.factorOrder.map((f)=>{ const a=((W.factorAngles[f]%360)+360)%360; const flip=a>90&&a<270; const rl=R+(flip?34:24);
    const d = flip ? `M ${polar(rl,a+60).map(v=>v.toFixed(2)).join(" ")} A ${rl} ${rl} 0 0 0 ${polar(rl,a-60).map(v=>v.toFixed(2)).join(" ")}`
                   : `M ${polar(rl,a-60).map(v=>v.toFixed(2)).join(" ")} A ${rl} ${rl} 0 0 1 ${polar(rl,a+60).map(v=>v.toFixed(2)).join(" ")}`;
    return `<path id="lp-${f}" d="${d}" fill="none"/><text font-family="Manrope,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="${W.factorColors[f]}"><textPath href="#lp-${f}" startOffset="50%" text-anchor="middle">${W.factorLabels[f].toUpperCase()}</textPath></text>`; }).join("");
  // ⛔⛔ BEING and DOING WERE NEVER REMOVED FROM THIS WHEEL, and Rachel has now
  // ruled against them THREE TIMES: 15 Sept 2026 on the Icehouse deck ("Remove
  // doing and being"), again on the field guide on 28 Sept ("remove the 'being'
  // and 'doing' part, it clutters the image"), and again the same day on this
  // screen ("I'm unsure why being and doing have reentered the picture"). They
  // had not reentered anything. The two <text> elements had sat here since the
  // first commit, so the ruling was honoured in two other renders and missed in
  // this one. `axisLabels` is deleted from the config as well, so there is
  // nothing left to render by accident. Do NOT reinstate them.
  svg.innerHTML = `
    <g id="wobbleRoot">
      <g id="spinner">
        <circle cx="${CX}" cy="${CY}" r="100" fill="none" stroke="${W.spokeColor}" stroke-width="1.6"/>
        ${ticks}${spokes}
        <circle cx="${CX}" cy="${CY-100}" r="3" fill="${W.hubColor}"/>
      </g>
      <circle cx="${CX}" cy="${CY}" r="52" fill="${W.hubColor}" opacity="0.06"/>
      <circle cx="${CX}" cy="${CY}" r="52" fill="none" stroke="${W.spokeColor}" stroke-width="1"/>
      <text id="scoreNum" x="${CX}" y="${CY+12}" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="46" font-weight="600" fill="${W.hubColor}">0</text>
      <text x="${CX}" y="${CY+32}" text-anchor="middle" font-family="Manrope,sans-serif" font-size="9" letter-spacing="2" fill="rgba(243,239,231,.55)">${C.scoreCaption.toUpperCase()}</text>
    </g>
    ${spinArrow}${labels}`;
  animateWheel(r);
}

function animateWheel(r){
  const spinner=$("spinner"), root=$("wobbleRoot"), num=$("scoreNum");
  const half=W.sectorSpanDegrees/2, R=W.arcRadius;
  const targetV=speedFor(r.capacityScore);
  const imbalance=(1-r.coherence)*W.wobble.sensitivity;
  const ease=easings[W.spinUp.easing]||easings.easeOutCubic;
  // the inner wheel (ticks/spokes) spins the same way the spin arrow points:
  // clockwise when building, counter-clockwise when depleting; count-up on the score.
  if(reducedMotion){ num.textContent=r.capacityScore; return; }
  let angle=0,last=performance.now(),start=last;
  function frame(now){
    const dt=(now-last)/1000; last=now;
    const elapsed=now-start;
    const p=Math.min(1,elapsed/W.spinUp.durationMs);
    const ramp=ease(p);
    angle+=targetV*ramp*dt;
    const t=elapsed/1000;
    const wob=W.wobble.maxAngleDegrees*imbalance*Math.sin(2*Math.PI*W.wobble.frequencyHz*t)*ramp;
    const ecc=W.wobble.maxEccentricityPx*imbalance*ramp;
    const arad=(angle*Math.PI)/180;
    root.setAttribute("transform",`translate(${(ecc*Math.sin(arad)).toFixed(2)} ${(-ecc*Math.cos(arad)).toFixed(2)})`);
    spinner.setAttribute("transform",`rotate(${(angle+wob).toFixed(2)} ${CX} ${CY})`);
    if(W.spinUp.countUp) num.textContent=Math.round(r.capacityScore*ease(Math.min(1,p*1.15)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// the opening diagram needs polar/arcPath/CX/CY, so it is built down here
buildIntroWheel();

/* ---------- PREVIEW URLS ----------
   ?demo=peak|steady|conserve|restore        jumps straight to that end slide
   &carry=team|build|solo                    sets the "who are you carrying" answer

   Built 28 Sept 2026 so Rachel can see each band's end slide without taking the
   wheel four times. Twelve combinations from two parameters, not twelve URLs.

   ⛔ A PREVIEW WRITES NOTHING. It calls computeCapacity and renderResult only.
   It never touches storeResponse, subscribeToKit or the dataLayer push, so no
   Supabase row, no Kit subscriber, no email, and canned runs cannot land in
   reporting as real people.

   ⛔ EVERY PRESET SITS IN THE MIDDLE OF ITS BAND, NEVER ON A BOUNDARY. The old
   steady preset totalled 30 drag = 71 and silently started rendering the Peak
   screen the moment Peak's floor moved to 68. A preview that sits on a cut
   lies to you the next time a cut moves. Answers are stored as NOTCHES, 0 =
   fully lifts and 4 = fully drags, which is the real five-position slider, and
   the drag value is 1 + 0.75 * notch. Score works out at round(100 - 1.5625K)
   where K is the total notches across all sixteen.

   Current bands and where each preset lands (checked against the live
   computeCapacity, not by hand):
     peak      K=11  score 83  in 68-100, 15 clear of the floor
     steady    K=27  score 58  in 50-67,   8 clear either side
     conserve  K=39  score 39  in 30-49,   9 clear either side
     restore   K=54  score 16  in  0-29,  13 clear either side
   Peak and Restore are EVEN wheels (the one-line read under the map), Steady
   and Conserve are UNEVEN (the collapsible tab), so both branches are covered.

   ⛔ If a band becomes hard to hit, change the preset, never the band. */
const params = new URLSearchParams(location.search);
const demo = params.get("demo");
if (demo !== null){
  // notches per statement: 0 = fully lifts, 4 = fully drags
  const presets = {
    peak:     { biology:[1,0,0,0], leadership:[1,1,1,0], behaviour:[1,1,1,0], environment:[1,1,1,1] },
    steady:   { biology:[1,1,1,0], leadership:[1,1,1,1], behaviour:[2,2,2,2], environment:[3,3,3,3] },
    conserve: { biology:[2,2,2,1], leadership:[3,2,2,1], behaviour:[3,3,3,3], environment:[4,3,3,2] },
    restore:  { biology:[3,3,3,3], leadership:[4,3,3,3], behaviour:[4,4,3,3], environment:[4,4,4,3] },
  };
  const key = Object.prototype.hasOwnProperty.call(presets, demo) ? demo : "conserve";
  const pick = presets[key];

  // Her question about who they carry is still asked, so the preview sets it.
  // ⚠ It will not change a single word on screen: {whoNeeds} is used by ZERO of
  // the sixteen statements since the Leadership rewrite, so all three values
  // render identically. That is a real finding about the question, not a fault
  // in the preview. The value still reaches Kit on a real run.
  const wanted = params.get("carry");
  if (wanted && (config.carry.options || []).some(o => o.key === wanted)) carryKey = wanted;

  // a preview must never be indexed, and the canonical in <head> already points
  // every query-string variant back at the clean URL
  const robots = document.createElement("meta");
  robots.name = "robots";
  robots.content = "noindex, nofollow";
  document.head.appendChild(robots);

  I.parts.forEach((p) => {
    const notches = pick[p.factor] || [2,2,2,2];
    answers[p.factor] = notches.map((n) => 1 + 0.75 * Math.max(0, Math.min(4, n)));
  });
  result = computeCapacity(answers, "assessment", config);
  renderResult(result);
  const flag = $("previewFlag");
  flag.textContent = "Preview. This is an example result, not yours. Nothing on this page has been saved and no email has been sent. Band " +
    result.band + ", score " + result.capacityScore + ", carrying: " + carryOption().label + ".";
  flag.hidden = false;
  show("result");
}
</script>
</body>
